<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernplattform — Entwurf</title>
<!-- Design mock for the look-and-feel decision (docs/DESIGN-UI.md). Two
     directions (data-dir="a" Morgenlicht, data-dir="b" Stille See), four
     screens. Query: ?dir=a|b&screen=welcome|home|question|results
     &device=ipad|iphone (frame width) · ?sheet=a|b renders a picture sheet.
     Names here are placeholders (no real child). Fonts from Google Fonts
     for the mock only; the app self-hosts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout concept: one atmospheric ground (sky + horizon) behind a centred
   column (max 680px); cards float on it; one accent; big touch targets. */
:root {
  --font-body: 'Nunito', 'Avenir Next', system-ui, sans-serif;
  --col: 680px;
  --tap: 60px;
  --shadow: 0 10px 30px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --ring: 3px;
}
[data-dir="a"] {
  --font-display: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --sky1: #FFF7EC; --sky2: #FFE7D1; --ground: #F7D9BD; --ground2: #EFC3A0;
  --sun: #FFD39A;
  --ink: #3B2A24; --ink-soft: #7A6259; --muted: #A89088;
  --card: #FFFFFF; --card-tint: #FFF3E6;
  --accent: #F0855F; --accent-ink: #FFFFFF; --accent-soft: #FFE3D6;
  --ok: #7CB68A; --ok-soft: #E3F2E6; --warn: #F2B35B; --warn-soft: #FFF0D6;
  --streak: #F2A54A;
  --radius: 24px; --radius-s: 16px;
  --m1: #E9F4F8; --m2: #F3ECFA; --m3: #EAF6EC; --m4: #FFF0DC; --m5: #F6EAE1;
}
[data-dir="b"] {
  --font-display: 'Quicksand', 'Nunito', system-ui, sans-serif;
  --sky1: #F1F8FA; --sky2: #DCEEF2; --ground: #BFDDE3; --ground2: #9FCBD4;
  --sun: #FFFFFF;
  --ink: #1E3A47; --ink-soft: #4F6B77; --muted: #8AA1AA;
  --card: #FFFFFF; --card-tint: #EEF6F8;
  --accent: #2E8C9B; --accent-ink: #FFFFFF; --accent-soft: #D7ECEF;
  --ok: #5FAE8A; --ok-soft: #DFF2E9; --warn: #E8B45C; --warn-soft: #FBF0D8;
  --streak: #E8B45C;
  --radius: 20px; --radius-s: 14px;
  --m1: #E3EFF4; --m2: #EAE8F4; --m3: #E4F1EA; --m4: #FBF1DE; --m5: #EFE9E3;
}

* { box-sizing: border-box; }
html, body, #app { height: 100%; margin: 0; }
body { font-family: var(--font-body); color: var(--ink); background: var(--sky1); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

/* ── the stage: one screen filling the frame ─────────────────────── */
.stage { position: relative; min-height: 100%; height: 100%; overflow: hidden;
  background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 70%, var(--ground) 100%); }
.horizon { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none; }
.horizon svg { width: 100%; height: 100%; display: block; }
.stage > .col { position: relative; z-index: 1; height: 100%; overflow: auto; margin: 0 auto; max-width: var(--col);
  padding-block: 20px 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }

h1, h2, .display { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 4.2vw, 40px); line-height: 1.1; }
h2 { font-size: 20px; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.soft { color: var(--ink-soft); }
.muted { color: var(--muted); }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--tap); padding: 0 26px;
  border-radius: 999px; border: 0; background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: 18px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: .01em; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink-soft); font-weight: 700; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card-tint); font-weight: 800; font-size: 14px; color: var(--ink-soft); }

/* ── welcome ────────────────────────────────────────────────────── */
.welcome { justify-content: center; text-align: center; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.avatars { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; margin-top: 8px; }
.avatar { display: grid; place-items: center; gap: 10px; background: none; border: 0; cursor: pointer; }
.avatar .disc { width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center; font-size: 72px;
  background: var(--card); box-shadow: var(--shadow); border: var(--ring) solid transparent; }
.avatar.selected .disc { border-color: var(--accent); }
.avatar .name { font-family: var(--font-display); font-weight: 600; font-size: 22px; }
.welcome .bottom { margin-top: auto; }

/* ── home ───────────────────────────────────────────────────────── */
.greet { display: flex; align-items: center; gap: 14px; }
.greet .disc { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--card); box-shadow: var(--shadow); }
.today { display: grid; gap: 16px; }
.today .plan { display: flex; gap: 14px; align-items: center; }
.today .plan .big { font-family: var(--font-display); font-size: 44px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.week { display: flex; gap: 8px; justify-content: space-between; }
.week .d { flex: 1; display: grid; gap: 6px; justify-items: center; font-size: 12px; font-weight: 800; color: var(--muted); }
.week .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--card-tint); display: grid; place-items: center; font-size: 14px; }
.week .dot.on { background: var(--streak); color: #fff; }
.week .dot.today { outline: var(--ring) solid var(--accent); outline-offset: 2px; }
.streak { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: var(--ink-soft); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 8px; text-align: left; border: 0; cursor: pointer; min-height: 150px; }
.tile .mascot { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 32px; background: var(--m1); }
.tile.m2 .mascot { background: var(--m2); } .tile.m3 .mascot { background: var(--m3); } .tile.m4 .mascot { background: var(--m4); } .tile.m5 .mascot { background: var(--m5); }
.tile .t { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.tile .s { font-size: 13px; font-weight: 700; color: var(--muted); }
.ring { --p: 0; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--card-tint) 0); display: grid; place-items: center; }
.ring::after { content: ''; width: 16px; height: 16px; border-radius: 50%; background: var(--card); }
.tile .foot { display: flex; align-items: center; justify-content: space-between; }
.folded { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.folded .mini { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: 14px; color: var(--ink-soft); }
.foot-note { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: auto; }

/* ── question ───────────────────────────────────────────────────── */
.topbar { display: flex; align-items: center; gap: 14px; }
.close { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); font-size: 18px; display: grid; place-items: center; }
.segments { flex: 1; display: flex; gap: 5px; }
.segments i { flex: 1; height: 8px; border-radius: 4px; background: rgba(0,0,0,.08); }
.segments i.done { background: var(--ok); }
.segments i.now { background: var(--accent); }
.counter { font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.speech { display: flex; align-items: flex-end; gap: 12px; }
.speech .m { font-size: 48px; line-height: 1; }
.speech .bubble { background: var(--card); border-radius: 18px 18px 18px 4px; padding: 10px 16px; box-shadow: var(--shadow); font-weight: 800; color: var(--ink-soft); }
.question { text-align: center; padding: 28px 24px; display: grid; gap: 10px; }
.question .q { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.25; }
.question .it { color: var(--muted); font-weight: 700; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.answer { min-height: 72px; border-radius: var(--radius-s); border: 2px solid transparent; background: var(--card); box-shadow: var(--shadow);
  font-weight: 800; font-size: 19px; padding: 14px 18px; cursor: pointer; }
.answer.ok { border-color: var(--ok); background: var(--ok-soft); }
.answer.no { border-color: var(--warn); background: var(--warn-soft); }
.sheet { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; display: grid; gap: 14px; border-top: 6px solid var(--ok); }
.sheet .head { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--ok); }
.sheet .btn { justify-self: end; }
.hint { font-size: 14px; color: var(--muted); font-weight: 700; text-align: center; }

/* ── results ────────────────────────────────────────────────────── */
.results { align-items: center; text-align: center; justify-content: center; }
.score { --p: 80; width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--card-tint) 0); box-shadow: var(--shadow); }
.score .inner { width: 150px; height: 150px; border-radius: 50%; background: var(--card); display: grid; place-content: center; }
.score .n { font-family: var(--font-display); font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { font-weight: 800; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.fact { background: var(--card); border-radius: var(--radius-s); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 4px; }
.fact .v { font-family: var(--font-display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
.fact .l { font-size: 13px; font-weight: 800; color: var(--muted); }
.results .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ── small screens ──────────────────────────────────────────────── */
@media (max-width: 560px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .answers { grid-template-columns: 1fr; }
  .avatar .disc { width: 120px; height: 120px; font-size: 60px; }
  .question .q { font-size: 24px; }
  .today .plan .big { font-size: 38px; }
  .facts { gap: 8px; }
}

/* ── toolbar (only when not framed) ─────────────────────────────── */
.toolbar { position: fixed; z-index: 9; left: 12px; bottom: 12px; display: flex; gap: 6px; background: rgba(255,255,255,.9); padding: 6px; border-radius: 12px; box-shadow: var(--shadow); font-size: 13px; }
.toolbar a { padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 800; }
.toolbar a.on { background: var(--accent); color: #fff; }
body[data-framed] .toolbar { display: none; }

/* ── picture sheet ──────────────────────────────────────────────── */
.sheet-page { background: #fff; padding: 24px; display: grid; gap: 18px; width: max-content; }
.sheet-page h1 { font-family: 'Nunito', sans-serif; font-size: 22px; color: #333; }
.frames { display: flex; gap: 18px; align-items: flex-start; }
.frame { position: relative; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 10px #222, 0 14px 30px rgba(0,0,0,.25); background: #fff; }
.frame iframe { border: 0; display: block; transform-origin: 0 0; }
.frame.ipad { width: 410px; height: 590px; } .frame.ipad iframe { width: 820px; height: 1180px; transform: scale(.5); }
.frame.iphone { width: 234px; height: 506px; } .frame.iphone iframe { width: 390px; height: 844px; transform: scale(.6); }
.cap { font: 800 13px 'Nunito', sans-serif; color: #555; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const dir = q.get('dir') === 'b' ? 'b' : 'a';
const screen = q.get('screen') || 'home';
const sheet = q.get('sheet');
const framed = q.has('framed');
document.documentElement.dataset.dir = dir;
if (framed) document.body.dataset.framed = '1';

const horizonA = `<svg viewBox="0 0 800 300" preserveAspectRatio="none" aria-hidden="true">
  <circle cx="610" cy="150" r="70" fill="var(--sun)" opacity=".9"/>
  <path d="M0 200 C 150 150, 300 230, 450 190 S 700 150, 800 200 L800 300 L0 300 Z" fill="var(--ground)"/>
  <path d="M0 250 C 200 210, 350 280, 520 240 S 720 230, 800 260 L800 300 L0 300 Z" fill="var(--ground2)" opacity=".8"/>
</svg>`;
const horizonB = `<svg viewBox="0 0 800 300" preserveAspectRatio="none" aria-hidden="true">
  <circle cx="120" cy="60" r="3" fill="#fff"/><circle cx="700" cy="40" r="2.5" fill="#fff"/><circle cx="420" cy="90" r="2" fill="#fff" opacity=".8"/>
  <path d="M0 210 Q 100 190 200 210 T 400 210 T 600 210 T 800 210 L800 300 L0 300 Z" fill="var(--ground)"/>
  <path d="M0 250 Q 100 235 200 250 T 400 250 T 600 250 T 800 250 L800 300 L0 300 Z" fill="var(--ground2)" opacity=".85"/>
</svg>`;
const horizon = dir === 'a' ? horizonA : horizonB;

const tiles = [
  ['🐋', 'Wale', 'Sachunterricht', 62, 'm1'],
  ['🦉', 'Deutsch mit Ella', '3 Wörter heute neu', 48, 'm2'],
  ['🗺️', 'Bundesländer', 'Neu · 16 Länder', 0, 'm3'],
];

const screens = {
  welcome: () => `
    <div class="col welcome">
      <div class="brand">Lernplattform</div>
      <h1>Wer bist du?</h1>
      <div class="avatars">
        <button class="avatar selected"><span class="disc">🦊</span><span class="name">Mia</span></button>
        <button class="avatar"><span class="disc">🐬</span><span class="name">Lena</span></button>
      </div>
      <div class="bottom"><button class="btn ghost">Eltern</button></div>
    </div>`,

  home: () => `
    <div class="col">
      <div class="greet"><span class="disc">🦊</span><div><h1>Hallo, Mia!</h1><div class="soft">Schön, dass du da bist.</div></div></div>
      <section class="card today">
        <div class="row spread">
          <span class="eyebrow">Heute</span>
          <span class="streak">🔥 6 Tage in Folge</span>
        </div>
        <div class="plan">
          <span class="big">12</span>
          <div><div style="font-weight:800;font-size:18px">Karten warten auf dich</div><div class="soft">5 davon sind neu · Wale und Deutsch</div></div>
        </div>
        <div class="week">
          ${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d, i) => `<div class="d"><span class="dot ${i < 6 ? 'on' : ''} ${i === 6 ? 'today' : ''}">${i < 6 ? '✓' : ''}</span>${d}</div>`).join('')}
        </div>
        <button class="btn primary" style="width:100%">Los geht's</button>
      </section>
      <div class="row spread"><h2>Deine Themen</h2><span class="chip">Test am 12. Nov · Bundesländer</span></div>
      <div class="tiles">
        ${tiles.map(([m, t, s, p, c]) => `<button class="tile ${c}"><span class="mascot">${m}</span><span class="t">${t}</span><span class="foot"><span class="s">${s}</span><span class="ring" style="--p:${p}"></span></span></button>`).join('')}
      </div>
      <div class="row spread"><h2>Spiele</h2></div>
      <div class="tiles">
        <button class="tile m4"><span class="mascot">🌧️</span><span class="t">Wort-Regen</span><span class="foot"><span class="s">Rekord 1240</span></span></button>
      </div>
      <div class="folded"><span class="muted" style="font-weight:800">Letztes Jahr:</span><span class="mini">💧 Wasser</span><span class="mini">🐊 Krokodildieb</span><span class="mini">🧲 Magnete</span></div>
      <div class="foot-note"><span>v2026.11 · Sync ✓</span><span>Eltern</span></div>
    </div>`,

  question: () => `
    <div class="col">
      <div class="topbar">
        <button class="close" aria-label="Schließen">✕</button>
        <div class="segments">${Array.from({ length: 10 }, (_, i) => `<i class="${i < 3 ? 'done' : i === 3 ? 'now' : ''}"></i>`).join('')}</div>
        <span class="counter">4 / 10</span>
      </div>
      <div class="speech"><span class="m">🐋</span><div class="bubble">Walarten · Denk nach!</div></div>
      <section class="card question">
        <span class="eyebrow">Wähle die richtige Antwort</span>
        <div class="q">Welcher dieser Wale ist KEIN Delfin?</div>
        <div class="it">Quale di queste balene NON è un delfino?</div>
      </section>
      <div class="answers">
        <button class="answer ok">Pottwal ✓</button>
        <button class="answer">Commersondelfin</button>
        <button class="answer">Amazonasdelfin</button>
        <button class="answer">Großer Tümmler</button>
      </div>
      <section class="sheet">
        <div class="head">Richtig!</div>
        <div>Der Pottwal ist ein Zahnwal, aber kein Delfin. Er ist der größte Zahnwal der Welt.</div>
        <button class="btn primary">Weiter</button>
      </section>
    </div>`,

  results: () => `
    <div class="col results">
      <span class="eyebrow">Wale · Walarten</span>
      <div class="score" style="--p:80"><div class="inner"><span class="n">8</span><span class="of">von 10</span></div></div>
      <h1>Super gemacht, Mia!</h1>
      <div class="soft" style="font-size:18px">🐋 Walli ist stolz auf dich.</div>
      <div class="facts">
        <div class="fact"><span class="v">3</span><span class="l">neu gelernt</span></div>
        <div class="fact"><span class="v">7</span><span class="l">wiederholt</span></div>
        <div class="fact"><span class="v">7</span><span class="l">Tage in Folge</span></div>
      </div>
      <div class="actions"><button class="btn">Nochmal</button><button class="btn primary">Fertig</button></div>
    </div>`,
};

function toolbar() {
  const link = (p, label, on) => `<a href="?${p}" class="${on ? 'on' : ''}">${label}</a>`;
  return `<nav class="toolbar">
    ${link(`dir=a&screen=${screen}`, 'A', dir === 'a')}${link(`dir=b&screen=${screen}`, 'B', dir === 'b')}
    <span style="width:8px"></span>
    ${['welcome', 'home', 'question', 'results'].map(s => link(`dir=${dir}&screen=${s}`, s, s === screen)).join('')}
  </nav>`;
}

if (sheet) {
  const d = sheet === 'b' ? 'b' : 'a';
  const names = { welcome: 'Willkommen', home: 'Start', question: 'Frage', results: 'Ergebnis' };
  const frame = (dev, s) => `<div><div class="frame ${dev}"><iframe src="?dir=${d}&screen=${s}&framed=1"></iframe></div><div class="cap">${names[s]}</div></div>`;
  document.body.style.background = '#fff';
  document.getElementById('app').innerHTML = `<div class="sheet-page">
    <h1>Richtung ${d.toUpperCase()} — ${d === 'a' ? 'Morgenlicht' : 'Stille See'} · iPad</h1>
    <div class="frames">${['welcome', 'home', 'question', 'results'].map(s => frame('ipad', s)).join('')}</div>
    <h1>iPhone</h1>
    <div class="frames">${['welcome', 'home', 'question', 'results'].map(s => frame('iphone', s)).join('')}</div>
  </div>`;
} else {
  document.getElementById('app').innerHTML = `<div class="stage"><div class="horizon">${horizon}</div>${screens[screen] ? screens[screen]() : screens.home()}</div>${toolbar()}`;
}
</script>
</body>
</html>
