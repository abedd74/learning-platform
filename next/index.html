<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F8FA">
<title>Lernplattform (Vorschau)</title>
<!-- Staging shell (DESIGN §10): the new app on a COPY of this device's data.
     The namespace keeps every key apart from the live app ('next_…') and the
     family sync stays off here. Removed at the switch. -->
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../app/ui/theme.css">
<link rel="stylesheet" href="../app/ui/app.css">
<script>window.LP_NAMESPACE = 'next_';</script>
</head>
<body>
<div id="app"><p id="boot-wait" style="margin:30vh auto 0;max-width:22rem;text-align:center;font:600 18px/1.5 system-ui,sans-serif;color:#3d6470;">Lädt …</p></div>
<noscript><p style="margin:2rem;font:16px/1.5 system-ui,sans-serif;">Die Lernplattform braucht JavaScript.</p></noscript>
<script>
// if nothing has replaced the waiting line after a while (no network, a file did not arrive): offer a retry
setTimeout(function () {
  var w = document.getElementById('boot-wait');
  if (!w) return;
  w.textContent = 'Das Laden klappt gerade nicht. ';
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = 'Nochmal versuchen';
  b.style.cssText = 'display:block;margin:.75rem auto 0;padding:.6rem 1rem;font:inherit;border-radius:10px;border:0;background:#2a7f8f;color:#fff;';
  b.onclick = function () { location.reload(); };
  w.appendChild(b);
}, 12000);
</script>
<script type="module" src="../app/boot.js"></script>
</body>
</html>
